<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Pengguna - StatusApp</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <header class="top-header">
    <a href="./index.html" class="brand">
      <img src="./assets/logo.svg" alt="Logo">
      <span>Profil</span>
    </a>
  </header>

  <main class="container">
    <div id="profile-header" class="card" style="text-align: center;">
      <img id="profile-avatar" src="./assets/default-avatar.svg" class="avatar" style="width: 72px; height: 72px; margin: 0 auto 12px;" alt="Avatar">
      <h2 id="profile-name" style="font-size: 1.2rem;">-</h2>
      <p id="profile-handle" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px;">@-</p>
      <p id="profile-bio" style="font-size: 0.9rem; margin-bottom: 12px;">-</p>
      <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-main);">
        <span id="profile-post-count">0</span> Status Dibuat
      </div>
    </div>

    <h3 style="font-size: 1rem; margin-bottom: 12px; padding: 0 4px;">Semua Postingan</h3>
    <div id="profile-posts"></div>
  </main>

  <nav class="bottom-nav">
    <a href="./index.html" class="nav-item"><span>🏠</span><span>Beranda</span></a>
    <a href="./create.html" class="nav-item"><span>➕</span><span>Buat</span></a>
    <a href="./login.html" id="nav-profile" class="nav-item active"><span>👤</span><span>Profil</span></a>
  </nav>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Login - StatusApp</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="container" style="max-width: 400px; margin-top: 40px;">
    <div class="card">
      <div style="text-align: center; margin-bottom: 20px;">
        <img src="./assets/logo.svg" alt="Logo" style="width: 48px; height: 48px;">
        <h2 style="margin-top: 8px;">Masuk ke Akun</h2>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input type="email" id="login-email" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" required>
        </div>
        <button type="submit" id="login-btn" class="btn">Masuk</button>
      </form>

      <p style="text-align: center; margin-top: 16px; font-size: 0.85rem;">
        Belum punya akun? <a href="./register.html" style="color: var(--primary);">Daftar di sini</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { loginUser } from "./js/auth.js";
    import { showAlert } from "./js/utils.js";

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.textContent = "Memproses...";

      try {
        await loginUser(email, pass);
        showAlert("Login berhasil!", "success");
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || './index.html';
        setTimeout(() => window.location.href = redirect, 800);
      } catch (err) {
        showAlert("Email atau kata sandi salah.", "error");
        btn.disabled = false;
        btn.textContent = "Masuk";
      }
    });
  </script>
</body>
</html>

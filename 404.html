<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Mengarahkan...</title>
  <script>
    // Menangkap path /@username dan mengalihkan ke profile.html?username=username
    const pathname = window.location.pathname;
    const segments = pathname.split('/');
    const lastSegment = segments[segments.length - 1] || segments[segments.length - 2];

    if (lastSegment && lastSegment.startsWith('@')) {
      const username = lastSegment.replace('@', '');
      window.location.replace('./profile.html?username=' + encodeURIComponent(username));
    } else {
      window.location.replace('./index.html');
    }
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">Mengarahkan...</p>
</body>
</html>
